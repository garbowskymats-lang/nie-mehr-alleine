<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anmelden – Nie mehr alleine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#071012">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nie mehr alleine">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<main class="auth">
  <div class="auth-photo"><p>Schön, dass du wieder da bist.</p></div>
  <div class="auth-side">
    <a class="brand" href="index.html"><i aria-hidden="true">♥</i><span>Nie mehr <b>alleine</b></span></a>
    <form class="card auth-card" id="loginForm" novalidate>
      <h1>Anmelden</h1>
      <p>Melde dich mit deinem Nickname oder deiner E-Mail-Adresse an.</p>
      <div class="field"><label for="nick">Nickname oder E-Mail</label><input class="input" id="nick" autocomplete="username" required></div>
      <div class="field"><label for="pw">Passwort</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
      <label class="check" style="margin-bottom:18px"><input type="checkbox" checked> Angemeldet bleiben</label>
      <button class="btn primary wide" type="submit">Anmelden</button>
      <p class="auth-alt"><a href="passwort.html">Passwort vergessen?</a></p>
      <p class="auth-alt">Noch kein Mitglied? <a href="register.html">Kostenlos registrieren</a></p>
      <p class="demo">Demo: Beliebige Eingaben funktionieren, es wird nichts gespeichert.</p>
    </form>
  </div>
</main>
<script src="app.js"></script>
<script>{
  /* Ein Login für alle: Mitarbeiter hängen ihre Team-Kennung an den Benutzernamen, z. B. „marco#2580“.
     „#“ ist in Kunden-Nicknames nicht erlaubt – Verwechslungen sind ausgeschlossen.
     SERVER: Die Kennung prüft nur der Server (nicht im Browser-Code!). Echte Sicherheit = Passwort (+ 2-Faktor). */
  if(NMA.param("gesperrt"))NMA.toast("5× falsche PIN – bitte mit Passwort anmelden und eine neue PIN festlegen.");
  else if(NMA.param("pinvergessen"))NMA.toast("Melde dich mit deinem Passwort an – danach legst du eine neue PIN fest.");
  const f=document.getElementById("loginForm"),nick=document.getElementById("nick"),pw=document.getElementById("pw");
  f.addEventListener("submit",e=>{e.preventDefault();
    if(!nick.value.trim()||!pw.value){NMA.toast("Bitte Nickname und Passwort eingeben.");return}
    const v=nick.value.trim(),suf=String(NMA.store.get("staffSuffix","#2580"));
    if(v.toLowerCase().endsWith(suf.toLowerCase())){
      const user=v.slice(0,-suf.length).trim().toLowerCase();
      const staff=NMA.store.get("staff",null)||[{user:"sandra",active:true},{user:"marco",active:true},{user:"julia",active:true},{user:"tim",active:true},{user:"nicole",active:true}];
      const s=staff.find(x=>x.user===user&&x.active!==false);
      if(!s){NMA.toast("Anmeldung fehlgeschlagen. Bitte Eingaben prüfen.");return}
      NMA.store.set("teamUser",user);location.href="team.html";return}
    const u=NMA.user();u.lastLogin=Date.now();NMA.store.set("user",u);try{sessionStorage.setItem("nma_unlocked","1")}catch(e){}location.href="uebersicht.html"});
}</script>
</body>
</html>
