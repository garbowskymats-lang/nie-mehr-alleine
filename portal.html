<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team-Portal – Anmeldung</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="manifest" href="team.webmanifest">
<meta name="theme-color" content="#071012">
<link rel="apple-touch-icon" sizes="180x180" href="assets/team-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team">
<link rel="icon" href="assets/team-192.png">
<link rel="stylesheet" href="style.css">
<style>
.pt{min-height:100svh;display:grid;place-items:center;padding:24px}
.pt .card{width:min(420px,100%);padding:30px}
.pt .logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;color:#0a1416;background:linear-gradient(145deg,var(--accent),#0a8f87);margin-bottom:16px}
.pt h1{font-size:30px;margin:0 0 4px}
</style>
</head>
<body class="full" data-page="team-login">
<!-- =====================================================================
     TEAM-PORTAL (eigene Domain, z. B. tippelclub.de)
     Hier melden sich NUR Mitarbeiter an. Alle Kunden-Domains (Eingänge) laufen im selben Chat zusammen –
     Mitarbeiter sehen nicht, über welche Domains die Kunden kommen.
     Diese Seite wird getrennt von den Kunden-Domains veröffentlicht (build-portal.sh), dort gibt es keine
     Kundenseiten, und auf den Kunden-Domains gibt es kein Team-Portal (build-kunden.sh).
     SERVER: Anmeldung mit Benutzername + Passwort (+ 2-Faktor empfohlen), Login-Versuche begrenzen,
     Team-Bereich nur mit gültiger Mitarbeiter-Sitzung ausliefern.
     ===================================================================== -->
<main class="pt">
  <form class="card" id="f" novalidate>
    <div class="logo" aria-hidden="true">✦</div>
    <h1>Team-Portal</h1>
    <p class="muted" style="margin:0 0 20px">Anmeldung für Mitarbeiter</p>
    <div class="field"><label for="u">Benutzername</label><input class="input" id="u" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="field"><label for="p">Passwort</label><input class="input" id="p" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%">Anmelden</button>
    <p class="hint" style="margin:14px 0 0">Demo: Benutzer sandra (Chef), marco, julia, tim oder nicole – Passwort beliebig.</p>
    <div id="appBox" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)" hidden>
      <b>📲 Team-App</b>
      <p class="hint" style="margin:4px 0 10px" id="appTxt">Ein Klick – dann öffnest du das Team-Portal wie eine App vom Startbildschirm.</p>
      <button type="button" class="btn primary" id="appBtn" hidden style="width:100%">📲 Team-App installieren</button>
    </div>
  </form>
</main>
<script src="app.js"></script>
<script>{
  const f=document.getElementById("f"),u=document.getElementById("u"),p=document.getElementById("p");
  f.addEventListener("submit",e=>{e.preventDefault();
    const user=u.value.trim().toLowerCase();if(!user||!p.value){NMA.toast("Bitte Benutzername und Passwort eingeben.");return}
    const staff=NMA.store.get("staff",null)||[{user:"sandra",active:true},{user:"marco",active:true},{user:"julia",active:true},{user:"tim",active:true},{user:"nicole",active:true}];
    const s=staff.find(x=>x.user===user&&x.active!==false);
    if(!s){NMA.toast("Anmeldung fehlgeschlagen. Bitte Eingaben prüfen.");return}
    const lg=NMA.store.get("staffLog",[]);lg.push({user,in:Date.now(),out:null});NMA.store.set("staffLog",lg.slice(-500));
    NMA.store.set("teamUser",user);location.href="team.html"});
  /* Team-App installieren – genau wie bei der Kundenseite: ein Klick; wo der Browser das nicht kann, kommt die Anleitung */
  {const box=document.getElementById("appBox"),btn=document.getElementById("appBtn");
    if(!NMA.install.standalone()){box.hidden=false;btn.hidden=false}
    btn.addEventListener("click",()=>NMA.installApp());}
  if(NMA.store.get("teamUser",null))NMA.toast("Du bist abgemeldet.");
  NMA.store.set("teamUser",null);
}</script>
</body>
</html>
